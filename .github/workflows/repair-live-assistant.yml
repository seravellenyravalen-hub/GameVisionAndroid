name: Repair Live Assistant Vision and Navigation

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.id == '368cd392186f3b0420477bd8a24d79a4f343111a'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Patch live vision and navigation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          server = Path('backend/src/server.js')
          s = server.read_text()
          old = 'const images = visualRequest && hasFrame ? frame.images : [];'
          new = 'const images = hasFreshFrame ? frame.images : [];'
          if old not in s:
              raise SystemExit('server patch anchor not found')
          s = s.replace(old, new, 1)
          old2 = 'visionFresh: visualRequest && hasFreshFrame,'
          new2 = 'visionFresh: hasFreshFrame,'
          if old2 not in s:
              raise SystemExit('server visionFresh anchor not found')
          s = s.replace(old2, new2, 1)
          server.write_text(s)

          activity = Path('app/src/main/java/com/gamevision/companion/MainActivity.kt')
          s = activity.read_text()
          old = '''    private fun bindNavigation() {\n        findViewById<LinearLayout>(R.id.navHome).setOnClickListener { showPage(R.id.homePage) }; findViewById<LinearLayout>(R.id.navAssistant).setOnClickListener { showPage(R.id.assistantPage) }\n        findViewById<LinearLayout>(R.id.navMonitor).setOnClickListener { showPage(R.id.monitorPage) }; findViewById<LinearLayout>(R.id.navActivity).setOnClickListener { showPage(R.id.activityPage) }; findViewById<LinearLayout>(R.id.navSettings).setOnClickListener { showPage(R.id.settingsPage) }\n    }'''
          new = '''    private fun bindNavigation() {\n        bindNav(R.id.navHome, R.id.homePage)\n        bindNav(R.id.navAssistant, R.id.assistantPage)\n        bindNav(R.id.navMonitor, R.id.monitorPage)\n        bindNav(R.id.navActivity, R.id.activityPage)\n        bindNav(R.id.navSettings, R.id.settingsPage)\n    }\n\n    private fun bindNav(navId: Int, pageId: Int) {\n        findViewById<LinearLayout>(navId).apply {\n            isClickable = true\n            isFocusable = true\n            setOnClickListener { showPage(pageId) }\n        }\n    }'''
          if old not in s:
              raise SystemExit('navigation patch anchor not found')
          activity.write_text(s.replace(old, new, 1))
          PY

          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/res/layout/activity_main.xml')
          s = p.read_text()
          for name in ('navHome', 'navAssistant', 'navMonitor', 'navActivity', 'navSettings'):
              old = f'<LinearLayout android:id="@+id/{name}"'
              new = f'<LinearLayout android:id="@+id/{name}" android:clickable="true" android:focusable="true"'
              if old not in s:
                  raise SystemExit(f'layout anchor not found: {name}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY

          git diff --check
          git diff -- backend/src/server.js app/src/main/java/com/gamevision/companion/MainActivity.kt app/src/main/res/layout/activity_main.xml

      - name: Test backend
        working-directory: backend
        run: npm test

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Run Android unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/GameVision.apk

      - name: Upload repaired APK
        uses: actions/upload-artifact@v4
        with:
          name: GameVision-Repaired
          path: app/build/outputs/apk/debug/GameVision.apk
          if-no-files-found: error
          retention-days: 30

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/server.js app/src/main/java/com/gamevision/companion/MainActivity.kt app/src/main/res/layout/activity_main.xml
          git commit -m "fix: restore live vision context and tab navigation"
          git push

      - name: Remove one-time repair workflow
        if: success()
        shell: bash
        run: |
          git rm .github/workflows/repair-live-assistant.yml
          git commit -m "chore: remove one-time repair workflow"
          git push
